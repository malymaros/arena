<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu návrh</title>
<!-- DEV náhľad: návrh menu ☰ s pixel ikonkami (client/menu-icons.js) - karta MENU aj ADMIN, vedľa pôvodný stav.
     Používa /styles.css; nové pravidlá sú v <style> nižšie, kým nie sú schválené. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  body { background: #08090c; margin: 0; font-family: system-ui, sans-serif; color: #f3e3c0; }
  #dev-bar { padding: 10px 16px; background: #1b1408; border-bottom: 2px solid #ffb300; font-size: 13px; }
  #dev-bar b { color: #ffb300; }
  .row { display: flex; flex-wrap: wrap; gap: 40px; padding: 30px 24px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .col h3 { margin: 0; font: 12px system-ui; color: #c9b58c; }
  /* panely v toku stránky (v hre sú na stred cez .ui-modal) */
  .demo.ui-modal { position: static; transform: none; width: 420px; }

  /* --- NÁVRH: položka = ikonka + text v riadku --- */
  .new .menu-item { flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; min-height: 52px; }
  .new .menu-item .menu-ico { flex: none; fill: #fff; filter: drop-shadow(2px 2px 0 #000); }
  .new .menu-item .menu-lbl { text-shadow: 2px 2px 0 #000; }
  /* ikonky v stĺpci 28 px - texty zarovnané pod sebou aj pri 13×13 chrobákovi */
  .new .menu-item .ico-box { width: 28px; flex: none; display: flex; justify-content: center; }
  /* REPORT BUG žltý (v tóne ostatných: tmavá výplň + bevel) */
  .new .menu-item.report { background: #7a5c0c; box-shadow: 0 0 0 2px #000, inset 2px 2px 0 #c09018, inset -2px -2px 0 #3a2a04; }
  .new .menu-item.report:hover { background: #8e6c10; }
  /* DOWNLOAD DATA zelený (rovnaký ako SEND v okne REPORT BUG) */
  .new .menu-item.menu-data { background: #2f5a1f; box-shadow: 0 0 0 2px #000, inset 2px 2px 0 #4f8a35, inset -2px -2px 0 #16290e; }
  .new .menu-item.menu-data:hover { background: #3a6e26; }
</style>
</head>
<body>
<div id="dev-bar"><b>Návrh menu ☰</b> — väčšie pixel ikonky (24 px, biele s čiernym tieňom), REPORT BUG s bielym chrobáčikom, admin: jediný prepínač ADMIN (vypnutý / zapnutý = červený), poradie DOWNLOAD DATA → RESET THIS ROOM → RESET ALL ROOMS. Vľavo pôvodný stav na porovnanie.</div>
<div class="row" id="out"></div>
<script type="module">
  import { menuIcon } from "/client/menu-icons.js";
  const head = (tabs, on) => `<div class="um-head"><span>MENU</span><button type="button" class="um-close">✕</button></div>${tabs ? `<div class="menu-tabs">
    <button type="button" class="menu-tab admin${on === "admin" ? " on" : ""}">ADMIN</button></div>` : ""}`;
  const item = (ico, lbl, cls = "") => `<button type="button" class="menu-item ${cls}"><span class="ico-box">${menuIcon(ico)}</span><span class="menu-lbl">${lbl}</span></button>`;
  const MAIN = item("reload", "RELOAD GAME") + item("fullscreen", "FULL SCREEN") + item("sound", "SOUND")
    + item("graphics", "GRAPHICS: LITE") + item("bug", "REPORT BUG", "report");
  const ADMIN = item("download", "DOWNLOAD DATA", "menu-data") + item("resetRoom", "RESET THIS ROOM", "danger")
    + item("resetAll", "RESET ALL ROOMS", "danger");
  const OLD = `<button type="button" class="menu-item">⟳ RELOAD GAME</button><button type="button" class="menu-item">⛶ FULL SCREEN</button>
    <button type="button" class="menu-item">♪ SOUND</button><button type="button" class="menu-item">◐ GRAPHICS: LITE</button>
    <button type="button" class="menu-item">REPORT BUG</button>`;
  const panel = (title, cls, html) => `<div class="col"><h3>${title}</h3><div class="ui-modal demo ${cls}">${html}</div></div>`;
  document.getElementById("out").innerHTML =
    panel("Pôvodne", "", head(false) + OLD)
    + panel("Návrh — hráč", "new", head(false) + MAIN)
    + panel("Návrh — admin, ADMIN vypnutý", "new", head(true, "main") + MAIN)
    + panel("Návrh — admin, ADMIN zapnutý", "new", head(true, "admin") + ADMIN);
</script>
</body>
</html>
