<!-- DEV náhľad: návrh lobby s náhodnou arénou a ADVANCED SETTINGS (nastavenia arén v samostatnom okne, uložené
     v prehliadači, reset na default) + animácia losovania arény. Nič z toho nie je v hre; používa /styles.css. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/styles-mobile.css" />
<script>
  // v ráme zariadenia (?device=phone|tablet): rovnaká virtuálna obrazovka ako client/viewport.js
  // (DESIGN 1720×920, telefón výška 830) - html.touch (+ .phone), --app-w/--app-h/--app-scale
  (function () {
    const dev = new URLSearchParams(location.search).get("device");
    if (!dev) return;
    const root = document.documentElement, phone = dev.startsWith("phone");
    root.classList.add("embed", "touch"); if (phone) root.classList.add("phone");
    const fit = () => {
      const vw = root.clientWidth, vh = root.clientHeight, s = Math.min(1, vw / 1720, vh / (phone ? 830 : 920));
      root.style.setProperty("--app-scale", s); root.style.setProperty("--app-w", vw / s + "px"); root.style.setProperty("--app-h", vh / s + "px");
      root.style.setProperty("--ui-k", 1 / s);
    };
    fit(); addEventListener("resize", fit);
  })();
</script>

<body>

<script type="module">
import { pixSvg } from "/client/pix.js";
import { PORTAL_TYPES, PORTAL_ORDER, FLAME2_SVG } from "/client/portal-art.js";
import { PORTAL_WEIGHTS, PORTAL_TILE_WEIGHTS, PORTALS_PER_ROUND, PORTAL_MAX_PAIRS, ITEM_WEIGHTS } from "/shared/balance.js";

const ARENAS = ["bridge", "portal", "swamp"];
// kocka v pixel arte, 3D (šikmý pohľad zhora): predná stena 12×12 (päť ôk), vrch (jedno oko) a pravý bok v tieni
// (tri oká) - 1/5/3 sú na skutočnej kocke susedné steny. Obrys len po vonkajšom okraji, hrany medzi stenami tmavšie.
const DICE_SVG = (() => {
  const S = 12, D = 5, W = S + D, g = Array.from({ length: W }, () => Array(W).fill(null));
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    if (x < S && y >= D) g[y][x] = "f";                                   // predná stena
    else if (y < D && x >= D - y && x < D - y + S) g[y][x] = "t";        // vrch (rovnobežník)
    else if (x >= S && y >= D - (x - S + 1) && y < D - (x - S + 1) + S) g[y][x] = "r"; // pravý bok
  }
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {               // hrany medzi stenami
    if (g[y][x] === "f" && (y === D || x === S - 1)) g[y][x] = "e";
  }
  const dot = (x, y, w = 2, h = 2) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g[y + j][x + i] = "p"; };
  [[2, 2], [8, 2], [5, 5], [2, 8], [8, 8]].forEach(([x, y]) => dot(x, D + y));  // päťka spredu
  dot(8, 2, 2, 1); dot(7, 3, 2, 1);                                              // jednotka v strede vrchu (šikmá ako stena)
  dot(15, 3, 1, 2); dot(14, 7, 1, 2); dot(13, 11, 1, 2);                         // trojka na boku
  const out = (x, y) => y < 0 || x < 0 || y >= W || x >= W || !g[y][x];
  const pal = { f: "#efe6cf", t: "#fffbf1", r: "#b9a983", e: "#8d7d5c", p: "#1a1a1a", o: "#000" };
  let r = "";
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    let c = g[y][x];
    if (!c) continue;
    if (out(x - 1, y) || out(x + 1, y) || out(x, y - 1) || out(x, y + 1)) c = "o";
    r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${W}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
})();
const NAME = { bridge: "STONE BRIDGE", portal: "PORTAL REALM", swamp: "SHREK SWAMP" };
const TAB = { bridge: "Stone Bridge", portal: "Portal Realm", swamp: "Shrek Swamp" };
const THUMB = { bridge: "/arenas/bridge/thumb.png", portal: "/arenas/portal-realm/portal-realm-hd.webp", swamp: "/arenas/shrek-swamp/shrek-swamp-hd.webp" };
const TILE = { dmg: ["flame", "Damage"], ik: ["skull", "Insta-kill"], heal: ["heart", "Heal"], power: ["sword", "Power"], mana: ["drop", "Mana"], block: ["shieldx", "Def-blocker"] };

// defaulty: pravidlá arény (Advanced) + spoločné voľby hlavného lobby
const DEF = {
  bridge: { count: 1, preview: "on", tiles: { dmg: 75, ik: 5, heal: 5, power: 5, mana: 5, block: 5 } },
  portal: { count: 1, preview: "on", tiles: { ...PORTAL_TILE_WEIGHTS }, portals: { ...PORTAL_WEIGHTS }, perRound: PORTALS_PER_ROUND },
  swamp:  { count: 1, preview: "on", items: { ...ITEM_WEIGHTS } },
};
const DEF_MAIN = { arena: "bridge", format: "bo3", color: "random", randomChars: "off", timer: "off" };
const KEY = "dev.lobby.v1"; // v hre napr. "arena.lobby.v1"
const clone = (o) => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);

// načítanie: neznáme / poškodené hodnoty → default (verzia kľúča = migrácia pri budúcej zmene tvaru)
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
  const st = { main: { ...DEF_MAIN }, adv: clone(DEF) };
  if (s?.main) for (const k in DEF_MAIN) if (typeof s.main[k] === "string") st.main[k] = s.main[k];
  for (const a of ARENAS) if (s?.adv?.[a]) {
    const src = s.adv[a], dst = st.adv[a];
    for (const k in dst) {
      if (typeof dst[k] === "object") { for (const kk in dst[k]) if (Number.isFinite(src[k]?.[kk])) dst[k][kk] = src[k][kk]; }
      else if (typeof src[k] === typeof dst[k]) dst[k] = src[k];
    }
  }
  return st;
}
const st = loadState();
let flash = 0;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
  const el = document.getElementById("saved"); el.textContent = "✓ SAVED IN THIS BROWSER";
  clearTimeout(flash); flash = setTimeout(() => el.textContent = "", 1400);
}
const custom = (a) => !same(st.adv[a], DEF[a]);
const valid = (a) => { const c = st.adv[a]; return a === "swamp" ? sum(c.items) === 100 : sum(c.tiles) === 100 && (a !== "portal" || sum(c.portals) === 100); };

/* ---------- hlavné lobby ---------- */
const $ = (id) => document.getElementById(id);
const imgs = {};
const load = (a) => imgs[a] ||= new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = THUMB[a]; });
function cover(cvs, img, x0 = 0, w = cvs.width) {
  const ctx = cvs.getContext("2d"), s = Math.max(w / img.width, cvs.height / img.height);
  ctx.drawImage(img, x0 + (w - img.width * s) / 2, (cvs.height - img.height * s) / 2, img.width * s, img.height * s);
}
async function drawThumb(cvs, a) {
  if (a !== "random") return cover(cvs, await load(a));
  const ctx = cvs.getContext("2d"), all = await Promise.all(ARENAS.map(load)), w = cvs.width / 3;
  all.forEach((img, i) => {
    ctx.save(); ctx.beginPath();
    ctx.moveTo(i * w + (i ? 30 : -40), 0); ctx.lineTo((i + 1) * w + (i < 2 ? 30 : 40), 0);
    ctx.lineTo((i + 1) * w + (i < 2 ? -30 : 40), cvs.height); ctx.lineTo(i * w + (i ? -30 : -40), cvs.height); ctx.closePath(); ctx.clip();
    cover(cvs, img, i * w - 40, w + 80); ctx.restore();
  });
  ctx.strokeStyle = "#000"; ctx.lineWidth = 6;
  [1, 2].forEach(i => { ctx.beginPath(); ctx.moveTo(i * w + 30, 0); ctx.lineTo(i * w - 30, cvs.height); ctx.stroke(); });
}
$("arena-pick").innerHTML = ARENAS.map(a =>
  `<button class="arena-card" data-arena="${a}"><canvas width="320" height="180"></canvas><span>${NAME[a]}</span></button>`).join("")
  + `<button class="dice-btn" data-arena="random" title="Random arena">${DICE_SVG}</button>`;
document.querySelectorAll(".arena-card").forEach(c => drawThumb(c.querySelector("canvas"), c.dataset.arena));

function renderMain() {
  const rnd = st.main.arena === "random";
  document.querySelectorAll("#arena-pick [data-arena]").forEach(c => c.classList.toggle("active", c.dataset.arena === st.main.arena));
  $("arena-pick").classList.toggle("pool", rnd);
  document.querySelectorAll("[data-f]").forEach(row => row.querySelectorAll(".opt").forEach(o => o.classList.toggle("active", o.dataset.val === st.main[row.dataset.f])));
  // jeden štítok: DEFAULT, alebo CUSTOM (+ pri kocke mená upravených arén)
  const shown = st.main.arena === "random" ? ARENAS : [st.main.arena], mod = shown.filter(custom);
  const SHORT = { bridge: "BRIDGE", portal: "PORTAL", swamp: "SWAMP" };
  $("adv-sum").innerHTML = mod.length ? `<span class="chip custom">CUSTOM${st.main.arena === "random" ? ": " + mod.map(a => SHORT[a]).join(", ") : ""}</span>` : `<span class="chip">DEFAULT</span>`;
}
$("lobby").addEventListener("click", (e) => {
  const c = e.target.closest("#arena-pick [data-arena]"), o = e.target.closest("[data-f] .opt");
  if (c) { st.main.arena = c.dataset.arena; save(); renderMain(); }
  else if (o) { st.main[o.parentElement.dataset.f] = o.dataset.val; save(); renderMain(); }
  else if (e.target.closest("#adv-open")) openAdv();
  else if (e.target.id === "start") { if (st.main.arena === "random") playRoll(); else alert("START → " + NAME[st.main.arena]); }
});

/* ---------- ADVANCED SETTINGS ---------- */
let tab = "bridge";
$("tabs").innerHTML = ARENAS.map(a => `<button class="arena-card" data-tab="${a}"><canvas width="320" height="180"></canvas><i class="dot"></i><span>${NAME[a]}</span></button>`).join("");
document.querySelectorAll("#tabs canvas").forEach(c => drawThumb(c, c.parentElement.dataset.tab));
function openAdv() { tab = st.main.arena === "random" ? "bridge" : st.main.arena; $("adv").classList.add("show"); renderAdv(); }
const optRow = (key, vals, cur, labels = vals) => `<div class="opt-row">${vals.map((v, i) => `<button class="opt${String(v) === String(cur) ? " active" : ""}" data-k="${key}" data-val="${v}">${labels[i]}</button>`).join("")}</div>`;
const stepBtn = (grp, k, d, t) => `<button type="button" class="w-step" data-g="${grp}" data-key="${k}" data-d="${d}">${t}</button>`;
function wRow(grp, k, label, ico, v) {
  return `<label class="weight"><span class="w-ico${grp === "tiles" && k === "dmg" && tab === "portal" ? " w-dmg2" : ""}">${ico}</span>${label}
    ${stepBtn(grp, k, -5, "−")}<input type="number" min="0" max="100" step="5" data-g="${grp}" data-key="${k}" value="${v}">${stepBtn(grp, k, 5, "+")}<span class="pct">%</span></label>`;
}
const sumLine = (o) => `<div class="weights-sum${sum(o) !== 100 ? " bad" : ""}">Total: ${sum(o)}%</div>`;
function renderAdv() {
  document.querySelectorAll("#tabs .arena-card").forEach(c => {
    const a = c.dataset.tab;
    c.classList.toggle("active", a === tab); c.classList.toggle("custom", custom(a)); c.classList.toggle("bad", !valid(a));
  });
  const c = st.adv[tab], swamp = tab === "swamp", portal = tab === "portal";
  const sec = (label, body) => `<div class="lobby-section"><div class="lobby-label">${label}</div>${body}</div>`;
  const weights = (rows, o) => `<div class="weights">${rows}</div>${sumLine(o)}`;
  // ľavý stĺpec vždy rovnako: počet za kolo, náhľad (+ portal realm: portály za kolo a dlaždice); pravý = percentá
  let L = sec(`${swamp ? "ITEMS" : "SPECIAL TILES"} PER ROUND`, optRow("count", [1, 2, 3], c.count))
    + sec(swamp ? "SHREK PREVIEW" : "TILE PREVIEW", optRow("preview", ["on", "off"], c.preview, ["On", "Off"]));
  let R = "";
  if (swamp) {
    R += sec("ITEM CHANCE", weights(wRow("items", "heal", "Heart", pixSvg("heart"), c.items.heal) + wRow("items", "mana", "Mana", pixSvg("drop"), c.items.mana), c.items));
  } else {
    const tiles = sec("TILE CHANCE", weights(Object.keys(c.tiles).map(k => wRow("tiles", k, TILE[k][1], k === "dmg" && portal ? FLAME2_SVG : pixSvg(TILE[k][0]), c.tiles[k])).join(""), c.tiles));
    if (portal) {
      // vľavo dlaždice (počet, náhľad, percentá), vpravo portály (počet za kolo hneď vedľa počtu dlaždíc, pod ním percentá)
      L += tiles;
      R += sec("PORTALS PER ROUND", optRow("perRound", [1, 2, 3, 4, 5, 6, PORTAL_MAX_PAIRS], c.perRound).replace('class="opt-row"', 'class="opt-row tight"'));
      R += sec("PORTAL CHANCE", weights(PORTAL_ORDER.map(k => wRow("portals", k, PORTAL_TYPES[k].en, `<span class="w-ico w-portal" style="--pc:${PORTAL_TYPES[k].pc};--pc2:${PORTAL_TYPES[k].pc2}"></span>`, c.portals[k])).join(""), c.portals));
    } else R += tiles;
  }
  $("adv-body").innerHTML = `<div class="adv-cols"><div>${L}</div><div>${R}</div></div>`;
  $("reset").textContent = "RESET TO DEFAULT";
  $("reset").disabled = !custom(tab);
  $("done").disabled = !ARENAS.every(valid);
}
$("adv").addEventListener("click", (e) => {
  const c = st.adv[tab];
  const t = e.target.closest("#tabs [data-tab]"), o = e.target.closest(".opt[data-k]"), s = e.target.closest(".w-step");
  if (t) { tab = t.dataset.tab; renderAdv(); return; }
  if (o) { c[o.dataset.k] = isNaN(o.dataset.val) ? o.dataset.val : Number(o.dataset.val); }
  else if (s) { e.preventDefault(); const g = c[s.dataset.g]; g[s.dataset.key] = Math.max(0, Math.min(100, g[s.dataset.key] + Number(s.dataset.d))); }
  else if (e.target.id === "reset") { st.adv[tab] = clone(DEF[tab]); }
  else if (e.target.id === "done" && !e.target.disabled) { $("adv").classList.remove("show"); renderMain(); return; }
  else if (e.target === $("adv") && ARENAS.every(valid)) { $("adv").classList.remove("show"); renderMain(); return; }
  else return;
  save(); renderAdv();
});
$("adv").addEventListener("change", (e) => {
  const i = e.target.closest("input[data-g]"); if (!i) return;
  st.adv[tab][i.dataset.g][i.dataset.key] = Math.max(0, Math.min(100, parseInt(i.value, 10) || 0));
  save(); renderAdv();
});

/* ---------- losovanie arény (divadlo - server už vybral) ---------- */
const roll = $("roll"), sleep = (ms) => new Promise(r => setTimeout(r, ms));
const hops = (n) => Array.from({ length: n }, (_, i) => 70 + Math.pow(i / (n - 1), 2.4) * 420);
let busy = false;
// priebeh (server už arénu vybral - čisté divadlo ako ruleta farieb):
//  1. tri karty, zlatý rám skáče a spomaľuje (~2.3 s, zvuk ui.random_hop pri každom skoku)
//  2. zastaví sa na víťazovi, krátka pauza, ostatné zošednú, názov arény vyskočí (ui.pick) (~1.3 s)
//  3. výsledok ostane ~1.5 s, overlay plynulo zmizne (0.4 s) → ruleta farieb
async function playRoll() {
  if (busy) return; busy = true;
  const win = ARENAS[Math.floor(Math.random() * 3)], target = ARENAS.indexOf(win);
  roll.innerHTML = `<div class="cr-title">ARENA</div><div class="row">${ARENAS.map(a => `<div class="big" data-a="${a}"><canvas width="600" height="340"></canvas><span>${NAME[a]}</span></div>`).join("")}</div><div class="name"></div>`;
  roll.style.opacity = ""; roll.classList.add("show");
  roll.querySelectorAll(".big").forEach(b => drawThumb(b.querySelector("canvas"), b.dataset.a));
  const bigs = [...roll.querySelectorAll(".big")], steps = 11 + ((target - 11) % 3 + 3) % 3, d = hops(steps + 1);
  for (let i = 0; i <= steps; i++) { bigs.forEach((b, k) => b.classList.toggle("hop", k === i % 3)); await sleep(d[i]); }
  await sleep(350);
  bigs.forEach((b, k) => { b.classList.remove("hop"); b.classList.add(k === target ? "win" : "lose"); });
  const nm = roll.querySelector(".name"); nm.textContent = NAME[win]; nm.classList.add("show");
  await sleep(1500); // výsledok chvíľu ostane, potom celé zmizne (bez priblíženia)
  roll.style.opacity = "0";
  await sleep(400);
  roll.classList.remove("show"); roll.style.opacity = "";
  const toast = document.createElement("div"); toast.className = "roll-next"; toast.textContent = `${NAME[win]} → (ďalej ruleta farieb, výber postáv)`;
  document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
  busy = false;
}
roll.addEventListener("click", () => { if (!busy) roll.classList.remove("show"); });
$("wipe").addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch {} location.reload(); });

document.querySelectorAll("[data-dev]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-dev]").forEach(x => x.classList.toggle("on", x === b));
  const wrap = $("frame-wrap"), d = b.dataset.dev;
  if (!d) { wrap.classList.remove("show"); $("frame").src = "about:blank"; return; }
  const [kind, size] = d.split(":"), [w, h] = size.split("x").map(Number);
  Object.assign($("frame").style, { width: w + "px", height: h + "px" });
  $("frame-dim").textContent = `${b.textContent}: ${w}×${h} CSS px - hra je zmenšená ako na skutočnom zariadení`;
  $("frame").src = `?device=${kind}`;
  wrap.classList.add("show");
}));

// ?adv=portal | ?roll=1 | ?device=phone - priamy stav pre screenshoty
const q = new URLSearchParams(location.search);
if (q.get("rnd")) st.main.arena = "random";
renderMain();
if (q.get("adv")) { st.main.arena = q.get("adv"); openAdv(); }
if (q.get("roll")) playRoll();
</script>
</body>
</html>
